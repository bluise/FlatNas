name: Build Desktop Widget (Windows)

# 说明：GitHub 的 push 触发器里 paths 过滤与 tags 不能可靠地混用，
# 所以这里用「手动触发 + 打 tag 自动触发」两种方式。
# 日常改 desktop/ 代码后，到 Actions 页点 Run workflow 即可。
#
# 用 desktop-* 前缀和主程序的 v* 区分：v* 会同时触发 Docker 与服务端 Release 打包。
on:
  workflow_dispatch:
  push:
    tags: ["desktop-*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install CLI
        working-directory: desktop
        run: npm ci

      - name: JS unit tests
        working-directory: desktop
        run: npm test

      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build Tauri app (NSIS installer + exe)
        working-directory: desktop
        run: npx tauri build

      - name: Rename installer to ASCII path
        working-directory: desktop
        shell: pwsh
        run: |
          $rel = "src-tauri\target\release"
          Get-ChildItem "$rel\bundle\nsis\*.exe" | ForEach-Object {
            Write-Host "installer: $($_.Name)  $([math]::Round($_.Length/1MB, 2)) MB"
            Copy-Item $_.FullName "$rel\bundle\nsis\FlatNas-Desktop-Setup.exe" -Force
          }
          # 独立 exe（免安装）：cargo 产物按 crate 名命名，不一定等于 productName，这里按大小挑
          $appExe = Get-ChildItem "$rel\*.exe" | Where-Object { $_.Length -gt 1MB } | Select-Object -First 1
          if ($appExe) {
            Write-Host "app exe: $($appExe.Name)  $([math]::Round($appExe.Length/1MB, 2)) MB"
            Copy-Item $appExe.FullName "$rel\FlatNas-Desktop-Portable.exe" -Force
          } else {
            Write-Host "::warning::未在 $rel 下找到独立 exe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatnas-desktop-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/FlatNas-Desktop-Setup.exe
            desktop/src-tauri/target/release/FlatNas-Desktop-Portable.exe

      - name: Attach to Release (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/FlatNas-Desktop-Setup.exe
            desktop/src-tauri/target/release/FlatNas-Desktop-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
