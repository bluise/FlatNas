[package]
name = "flatnas-desktop"
version = "1.0.3"
description = "FlatNas 待办桌面小插件"
authors = ["bluise"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
# 体积优先：LTO + 体积优化 + 去符号 + panic=abort
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
