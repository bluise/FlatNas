<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <title>FlatNas 待办 · 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>FlatNas 待办 · 设置</h1>
      <button id="btn-close" class="ghost">完成</button>
    </header>

    <main>
      <section>
        <h2>连接</h2>
        <label>
          <span>服务器地址</span>
          <input id="baseUrl" type="text" placeholder="http://192.168.1.10:23000" autocomplete="off" />
        </label>
        <p class="tip">填 FlatNas 的访问地址，局域网一般形如 <code>http://NAS的IP:23000</code></p>

        <div class="row">
          <label>
            <span>用户名</span>
            <input id="username" type="text" autocomplete="off" />
          </label>
          <label>
            <span>密码</span>
            <input id="password" type="password" placeholder="留空表示不修改" autocomplete="off" />
          </label>
        </div>

        <label class="check"><input id="rememberPassword" type="checkbox" /> <span>记住密码（自动登录，保存到本机配置目录）</span></label>
        <p class="tip" id="remember-hint">尚未登录</p>

        <div class="row actions">
          <button id="btn-test" class="primary">测试连接</button>
          <button id="btn-save" class="primary">保存并同步</button>
          <span id="test-result" class="result"></span>
        </div>

        <label>
          <span>待办组件</span>
          <select id="widgetId">
            <option value="">（先测试连接以加载列表）</option>
          </select>
        </label>
        <p class="tip">对应 FlatNas 里那个「待办事项」组件；测试连接后会自动列出所有待办组件。</p>
      </section>

      <section>
        <h2>同步</h2>
        <label>
          <span>同步间隔（秒）</span>
          <input id="intervalSec" type="number" min="3" max="3600" step="1" />
        </label>
        <p class="tip">本地改动会立即上传；无改动时按该间隔拉取远端。</p>
      </section>

      <section>
        <h2>外观</h2>
        <label class="slider">
          <span>背景不透明度 <b id="opacity-val">85%</b></span>
          <input id="opacity" type="range" min="0.15" max="1" step="0.05" />
        </label>
        <p class="tip">调到最低几乎完全透明，只留文字（文字始终不透明，保证可读）。</p>

        <div class="row">
          <label>
            <span>背景颜色</span>
            <input id="cardColor" type="color" />
          </label>
          <label>
            <span>文字颜色</span>
            <input id="textColor" type="color" />
          </label>
          <label>
            <span>强调色</span>
            <input id="accentColor" type="color" />
          </label>
        </div>

        <label class="slider">
          <span>字号 <b id="fontsize-val">14px</b></span>
          <input id="fontSize" type="range" min="10" max="28" step="1" />
        </label>

        <div class="row">
          <label>
            <span>窗口宽度</span>
            <input id="width" type="number" min="220" max="1200" step="10" />
          </label>
          <label>
            <span>窗口高度</span>
            <input id="height" type="number" min="200" max="1600" step="10" />
          </label>
        </div>
      </section>

      <section>
        <h2>行为</h2>
        <div class="checks">
          <label class="check"><input id="alwaysOnTop" type="checkbox" /> <span>窗口置顶显示</span></label>
          <label class="check"><input id="skipTaskbar" type="checkbox" /> <span>隐藏任务栏图标（只留托盘）</span></label>
          <label class="check"><input id="showDone" type="checkbox" /> <span>显示已完成项</span></label>
          <label class="check"><input id="confirmDelete" type="checkbox" /> <span>删除前确认</span></label>
          <label class="check"><input id="launchAtLogin" type="checkbox" /> <span>开机自动启动</span></label>
          <label class="check"><input id="clickThrough" type="checkbox" /> <span>鼠标穿透（快捷键 Ctrl+Alt+L 可切换）</span></label>
        </div>
        <p class="tip">开启鼠标穿透后点击会透到下层窗口，用托盘菜单或 Ctrl+Alt+L 关掉。</p>
      </section>

      <section>
        <h2>关于</h2>
        <p class="tip">
          版本 <b id="app-version">-</b> · 数据来自你的 FlatNas 服务器，本插件不存储密码明文（Windows 下用
          DPAPI 加密）。
        </p>
        <div class="row actions">
          <button id="btn-repo" class="ghost">打开项目主页</button>
          <button id="btn-sync" class="ghost">立即同步一次</button>
        </div>
      </section>
    </main>

    <script type="module" src="settings.js"></script>
  </body>
</html>
